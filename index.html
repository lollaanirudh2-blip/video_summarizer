<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Summarizer</title>
<style>
  :root { --bg:#0f1720; --card:#161f2b; --line:#2a3646; --text:#e6edf5; --muted:#93a1b3; --accent:#6c8cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Georgia,"Times New Roman",serif; padding:32px 16px; }
  .wrap { max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  h1 { margin:0 0 14px; font-size:24px; }
  input[type=text] { width:100%; padding:12px; border-radius:8px; border:1px solid var(--line); background:#0f1720; color:var(--text); font-size:15px; }
  .drop { margin:14px 0; padding:22px; border:2px dashed var(--line); border-radius:10px; text-align:center; color:var(--muted); cursor:pointer; }
  .drop.over { border-color:var(--accent); }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  button, select { font-family:inherit; font-size:15px; padding:10px 16px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:bold; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #status { margin-top:12px; color:var(--muted); }
  .bar { height:8px; background:#0f1720; border-radius:6px; overflow:hidden; margin-top:8px; display:none; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .3s; }
  .file-head { background:#243040; padding:6px 12px; border-radius:8px 8px 0 0; font-family:Arial,sans-serif; font-size:14px; }
  textarea { width:100%; height:300px; background:#1b2532; color:var(--text); border:1px solid var(--line); border-top:none;
             border-radius:0 0 8px 8px; padding:14px; font-family:Consolas,monospace; font-size:15px; line-height:1.5; resize:vertical; }
  #warn { color:#f2c46d; margin:0 0 12px; display:none; }
  details { margin-top:14px; color:var(--muted); }
  #transcript { white-space:pre-wrap; margin-top:10px; color:var(--text); font-size:14px; line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h1>Media Summarizer</h1>
    <input type="text" id="url" placeholder="Paste a YouTube / video link here">
    <div class="drop" id="drop">Click or drop a video / audio file here</div>
    <input type="file" id="file" accept="video/*,audio/*" hidden>
    <div class="row">
      <button class="primary" id="go">Summarize</button>
      <button id="clear">Clear</button>
    </div>
    <div id="status"></div>
    <div class="bar" id="bar"><div id="fill"></div></div>
  </div>

  <div class="card">
    <p id="warn"></p>
    <div class="file-head">Summary.txt</div>
    <textarea id="summary" placeholder="Your summary will appear here..."></textarea>
    <div class="row" style="margin-top:14px">
      <button id="read">Read aloud</button>
      <button id="stop">Stop</button>
      <select id="voice"></select>
      <button id="notepad">Open in Notepad</button>
      <button id="download">Download .txt</button>
    </div>
    <details>
      <summary>Show full transcript</summary>
      <div id="transcript"></div>
    </details>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
let chosenFile = null, timer = null;

// ---------- file picking ----------
$("drop").onclick = () => $("file").click();
$("file").onchange = e => setFile(e.target.files[0]);
$("drop").ondragover = e => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = e => { e.preventDefault(); $("drop").classList.remove("over"); setFile(e.dataTransfer.files[0]); };
function setFile(f) {
  chosenFile = f || null;
  $("drop").textContent = f ? "Selected: " + f.name : "Click or drop a video / audio file here";
}

// ---------- summarize ----------
$("go").onclick = async () => {
  const url = $("url").value.trim();
  if (!url && !chosenFile) { $("status").textContent = "Paste a link or choose a file."; return; }
  const fd = new FormData();
  if (chosenFile) fd.append("file", chosenFile); else fd.append("url", url);

  $("go").disabled = true;
  $("summary").value = ""; $("transcript").textContent = ""; $("warn").style.display = "none";
  $("status").textContent = "Starting..."; $("bar").style.display = "block"; $("fill").style.width = "0";

  try {
    const r = await fetch("/api/summarize", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Request failed");
    poll(j.job_id);
  } catch (err) { fail(err.message); }
};

function poll(id) {
  clearInterval(timer);
  timer = setInterval(async () => {
    try {
      const r = await fetch("/api/status/" + id);
      const job = await r.json();
      if (job.status === "error") { clearInterval(timer); return fail(job.error); }
      $("status").textContent = (job.stage || "Working...") + (job.percent ? " " + job.percent + "%" : "");
      $("fill").style.width = (job.percent || 0) + "%";
      if (job.status === "done") { clearInterval(timer); show(job); }
    } catch (err) { clearInterval(timer); fail(err.message); }
  }, 1000);
}

function show(job) {
  $("go").disabled = false;
  $("bar").style.display = "none";
  $("summary").value = job.summary_text || "No summary was returned.";
  $("transcript").textContent = job.transcript || "";
  if (job.warning) { $("warn").textContent = job.warning; $("warn").style.display = "block"; }
  $("status").textContent = "Done. Press \u201cRead aloud\u201d to listen.";
}
function fail(msg) {
  $("go").disabled = false; $("bar").style.display = "none";
  $("status").textContent = "Error: " + msg;
}

// ---------- clear ----------
$("clear").onclick = () => {
  clearInterval(timer); speechSynthesis.cancel();
  $("url").value = ""; $("file").value = ""; setFile(null);
  $("summary").value = ""; $("transcript").textContent = ""; $("status").textContent = "";
  $("warn").style.display = "none"; $("bar").style.display = "none"; $("go").disabled = false;
};

// ---------- read aloud ----------
function loadVoices() {
  const sel = $("voice"); sel.innerHTML = "";
  speechSynthesis.getVoices().forEach((v, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = v.name + " (" + v.lang + ")"; sel.appendChild(o);
  });
}
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();
$("read").onclick = () => {
  const text = $("summary").value.trim(); if (!text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = speechSynthesis.getVoices()[$("voice").value]; if (v) u.voice = v;
  speechSynthesis.speak(u);
};
$("stop").onclick = () => speechSynthesis.cancel();

// ---------- export ----------
$("notepad").onclick = () => fetch("/api/open-notepad", {
  method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ text: $("summary").value })
});
$("download").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([$("summary").value], { type: "text/plain" }));
  a.download = "summary.txt"; a.click();
};
</script>
</body>
</html>
